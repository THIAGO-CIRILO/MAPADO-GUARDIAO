<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinco minutos antes da leitura · Mapa do Guardião</title><link rel="stylesheet" href="/consulta.css"><style>body{background:#f6f1eb;padding:20px;margin:0;color:#453a33;font-family:Figtree,Arial,sans-serif}main{max-width:640px;margin:35px auto;background:#fff;padding:30px;border:1px solid #ddd2c4;border-radius:8px}h1{font:400 42px/1.1 'Instrument Serif',Georgia,serif}p{line-height:1.6}audio{width:100%;margin:20px 0}a{color:#a35330}details{margin-top:25px}summary{cursor:pointer}</style></head><body><main><p class="consulta-kicker">MAPA DO GUARDIÃO · PREPARAÇÃO</p><h1>Cinco minutos antes da leitura</h1><p>Uma pausa antes de abrir seu mapa. Encontre uma posição confortável e ouça no seu ritmo. Você pode manter os olhos abertos, pausar ou interromper a prática.</p><audio controls preload="metadata" aria-label="Meditação de preparação de cinco minutos" src="/audio/preparacao-5min.mp3"></audio><p id="audioStatus" role="status"></p><details><summary>Ler a prática</summary><div id="roteiro"></div></details><p><a href="/">Voltar ao meu mapa</a></p></main><script src="/consulta-entrada.js"></script><script src="/consulta-modelo.js"></script><script>document.getElementById('roteiro').innerHTML=GuardiaoConsulta.meditacao.map(x=>'<h2>'+x[0]+'</h2><p>'+x[1]+'</p>').join('');document.querySelector('audio').addEventListener('error',()=>{document.getElementById('audioStatus').textContent='Não consegui carregar o áudio. Você pode ler a prática abaixo e fazer uma pausa entre os trechos.';});</script></body></html>
